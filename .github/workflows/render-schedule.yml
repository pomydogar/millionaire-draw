name: Render schedule image

# Renders schedule_card.html into schedule.png and commits it, so the club
# bot can send the picture into the WhatsApp group (send-schedule.yml in the
# automation repo). Re-run this whenever schedule_card.html changes.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install emoji fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-color-emoji
      - name: Render schedule_card.html to schedule.png
        run: |
          npx --yes playwright@1.49.0 install --with-deps chromium
          npx --yes playwright@1.49.0 screenshot --viewport-size=800,700 --full-page --wait-for-timeout=1500 "file://$PWD/schedule_card.html" schedule.png
          ls -la schedule.png
      - name: Commit image
        run: |
          git config user.name "millionaire-club-bot"
          git config user.email "bot@users.noreply.github.com"
          git add schedule.png
          git commit -m "render schedule image" || echo "no changes"
          git push
